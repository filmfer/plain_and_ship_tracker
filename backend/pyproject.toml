[project]
name = "plain-boat-radar-backend"
version = "0.1.0"
description = "Provider-independent live aircraft and ship tracking backend."
requires-python = ">=3.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
